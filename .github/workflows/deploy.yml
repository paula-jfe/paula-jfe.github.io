name: Deploy Portfolio App to GitHub Pages

on:
    push:
        branches:
            - main

concurrency:
    group: deploy-pages
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm install

            - name: Type check
              run: npm run typecheck

            - name: Run unit tests
              run: npm test -- --ci

            - name: Build project
              run: npm run build:prod

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
