name: CI

on:
    pull_request:
        branches:
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm install

            - name: Type check
              run: npm run typecheck

            - name: Run unit tests
              run: npm test -- --ci

            - name: Build project
              run: npm run build:prod
